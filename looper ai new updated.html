<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looper AI — Dual Engine Secure Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0a0b10;
      --card-bg: rgba(18, 20, 32, 0.85);
      --card-border: rgba(0, 240, 255, 0.2);
      --cyan: #00f0ff;
      --magenta: #ff007f;
      --green: #00ff88;
      --text-main: #f0f2fe;
      --text-muted: #8a8fab;
      --input-bg: #07080d;
      --sidebar-width: 260px;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-family);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* CHILDISH MODE OVERRIDE */
    body.child-mode {
      background-color: #fff0f5 !important;
      background-image: radial-gradient(circle at 50% 50%, #ffe4e1 0%, #fff0f5 100%) !important;
      color: #333333 !important;
    }

    body.child-mode .glass-card, body.child-mode .sidebar {
      background: rgba(255, 240, 245, 0.9) !important;
      border-color: #ffb6c1 !important;
    }

    body.child-mode .brand-title, body.child-mode .sidebar-title {
      color: #ff1493 !important;
      text-shadow: none !important;
    }

    body.child-mode .chat-box {
      background: rgba(255, 255, 255, 0.8) !important;
      border-color: #ffb6c1 !important;
    }

    body.child-mode .msg-row.looper .msg-content {
      background: #ffe4e1 !important;
      border-color: #ffb6c1 !important;
      color: #000000 !important;
    }

    body.child-mode .msg-row.user .msg-content {
      background: #e0ffff !important;
      border-color: #87cefa !important;
      color: #000000 !important;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background: rgba(12, 14, 24, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 15px;
      z-index: 20;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }

    .history-item:hover, .history-item.active {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--cyan);
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .sidebar-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    /* WORKSPACE */
    .main-workspace {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    .action-btn-group {
      display: flex;
      gap: 8px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: rgba(7, 8, 13, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 85%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { align-self: flex-end; }
    .msg-row.looper, .msg-row.sys-notice { align-self: flex-start; }

    .msg-author {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .msg-content {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .msg-content {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
    }

    .looper .msg-content {
      background: rgba(255, 0, 127, 0.1);
      border: 1px solid rgba(255, 0, 127, 0.3);
      color: #f0f2fe;
    }

    .sys-notice .msg-content {
      background: rgba(255, 180, 0, 0.15);
      border: 1px solid rgba(255, 180, 0, 0.4);
      color: #ffd700;
      font-weight: 600;
    }

    .input-bar {
      display: flex;
      gap: 10px;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--cyan);
    }

    textarea { resize: none; height: 50px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 18px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); }

    .btn-cyan { background: var(--cyan); color: #000; }
    .btn-magenta { background: var(--magenta); color: #fff; }
    .btn-green { background: var(--green); color: #000; }
    .btn-green.recording { background: #ff3333; color: #fff; animation: pulse 1s infinite alternate; }
    .btn-dark { background: #222536; color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); }

    @keyframes pulse {
      0% { opacity: 1; box-shadow: 0 0 5px #ff3333; }
      100% { opacity: 0.6; box-shadow: 0 0 15px #ff3333; }
    }

    /* AUTH OVERLAY */
    #authOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 11, 16, 0.95);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #authCard {
      width: 440px;
      padding: 30px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    /* SETTINGS MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      z-index: 150;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: 380px;
      padding: 25px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    /* ADMIN WINDOW (Ctrl + U + 4) */
    #adminWindow {
      display: none;
      position: fixed;
      top: 5%; left: 5%; width: 90vw; height: 90vh;
      z-index: 200;
      padding: 20px;
      border-radius: 12px;
      flex-direction: column;
      gap: 15px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      flex: 1;
    }

    .admin-grid textarea {
      height: 100%;
      font-family: monospace;
      font-size: 13px;
      color: var(--green);
      background: #050608;
    }
  </style>
</head>
<body>

  <!-- HIDDEN FILE INPUT FOR IMPORT -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="handleImportJson(event)">

  <!-- AUTH SCREEN OVERLAY -->
  <div id="authOverlay">
    <div id="authCard" class="glass-card">
      <div style="font-size: 22px; font-weight: 800; color: var(--cyan); letter-spacing: 1px;">LOOPER AI</div>
      <div style="font-size: 12px; color: var(--text-muted);">Enter workspace credentials or restore backup</div>

      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Master Password">
      <input type="password" id="loginGptKey" placeholder="OpenAI API Key (Optional)">
      <input type="password" id="loginGeminiKey" placeholder="Gemini API Key">

      <button class="btn-cyan" onclick="handleLaunch()">Start Session</button>
      <button class="btn-dark" onclick="triggerImportJson()">📥 Import Backup JSON</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card glass-card">
      <div style="font-size: 16px; font-weight: 700; color: var(--cyan);">WORKSPACE SETTINGS</div>
      
      <div class="setting-row">
        <span>Childish Mode (Kitty AI)</span>
        <input type="checkbox" id="childModeToggle" onchange="toggleChildMode(this.checked)">
      </div>

      <div class="setting-row">
        <span>Language</span>
        <select id="langSelect" style="width: 140px; padding: 6px;" onchange="updateSelectedLanguage()">
          <option value="en-US">English</option>
          <option value="ml-IN">Malayalam (മലയാളം)</option>
        </select>
      </div>

      <button class="btn-cyan" style="width: 100%; justify-content: center;" onclick="toggleSettingsModal()">Close Settings</button>
    </div>
  </div>

  <!-- ADMIN SECRET WINDOW (Ctrl + U + 4) -->
  <div id="adminWindow" class="glass-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 18px; font-weight: 800; color: var(--green);">ADMIN CODE & BEHAVIOR STUDIO</div>
      <button class="btn-magenta" onclick="closeAdminWindow()">Close Panel</button>
    </div>

    <div class="admin-grid">
      <div>
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">LIVE APP SOURCE CODE (HTML/CSS/JS)</label>
        <textarea id="adminCodeEditor"></textarea>
      </div>
      <div>
        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px;">AI BEHAVIOR & SYSTEM INSTRUCTIONS</label>
        <textarea id="adminBehaviorEditor" placeholder="Teach names, roles, and behavioral logic to both engines..."></textarea>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn-green" onclick="applyAdminUpdates()">Apply New Code & Behaviors</button>
    </div>
  </div>

  <!-- MAIN VIEWPORT -->
  <div class="app-viewport">
    
    <!-- SIDEBAR -->
    <div class="sidebar glass-card">
      <div class="sidebar-header">
        <div class="sidebar-title">CHAT HISTORY</div>
        <button class="btn-cyan" style="padding: 6px 12px; font-size: 12px;" onclick="startNewChat()">+ New</button>
      </div>
      
      <div class="history-list" id="historyList"></div>

      <div class="sidebar-actions">
        <button class="btn-dark" style="width: 100%; font-size: 12px;" onclick="toggleSettingsModal()">⚙️ Settings</button>
        <button class="btn-dark" style="width: 100%; font-size: 12px;" onclick="triggerImportJson()">📥 Import Backup</button>
        <button class="btn-dark" style="width: 100%; font-size: 12px;" onclick="exportBackupJson()">📤 Export Backup</button>
        <button class="btn-dark" style="width: 100%; font-size: 12px; color: var(--magenta);" onclick="logoutSession()">🔒 Lock / Logout</button>
      </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="main-workspace">
      <div class="header-bar">
        <div>
          <div class="brand-title" id="displayUsername">LOOPER AI</div>
        </div>
        <div class="action-btn-group">
          <button class="btn-dark" style="padding: 6px 12px; font-size: 12px;" onclick="toggleSettingsModal()">⚙️ Settings</button>
          <span class="status-text" id="statusLabel" style="align-self: center; margin-right: 10px;">System Active</span>
        </div>
      </div>

      <div class="chat-box" id="chatDisplay"></div>

      <div class="input-bar">
        <textarea id="promptInput" placeholder="Send prompt to Looper AI..."></textarea>
        <button id="voiceBtn" class="btn-green" onclick="toggleVoiceChat()">🎤 Live Voice</button>
        <button class="btn-magenta" onclick="runDualEnginePipeline()">Execute</button>
      </div>
    </div>

  </div>

  <script>
    let activeCredentials = null;
    let activePassword = null;
    let allSessions = [];
    let currentSessionId = null;

    let hasShownGptFallbackNotice = false;
    let isGptDisabled = false;

    let recognition = null;
    let isListening = false;
    let voiceAutoSubmit = false;

    let isChildMode = false;
    let currentLanguage = 'en-US';
    let adminCustomBehavior = "";

    // HOTKEYS: Ctrl+Y (Exit Childish Mode) | Ctrl+U+4 (Secret Admin Studio)
    let keysPressed = {};
    document.addEventListener('keydown', (e) => {
      keysPressed[e.key] = true;

      if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) {
        e.preventDefault();
        document.getElementById('childModeToggle').checked = false;
        toggleChildMode(false);
      }

      if (keysPressed['Control'] && (keysPressed['u'] || keysPressed['U']) && keysPressed['4']) {
        e.preventDefault();
        openAdminWindow();
      }
    });

    document.addEventListener('keyup', (e) => {
      delete keysPressed[e.key];
    });

    // FIXED SPEECH RECOGNITION (Prevents micro-blinking / rapid loop crashes)
    function initSpeechRecognition() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        // Use non-continuous mode to maintain stable browser audio stream
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = currentLanguage;

        recognition.onstart = () => {
          isListening = true;
          const voiceBtn = document.getElementById('voiceBtn');
          voiceBtn.classList.add('recording');
          voiceBtn.innerText = '🔴 Listening...';
          document.getElementById('statusLabel').innerText = "Listening to voice input...";
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById('promptInput').value = transcript;
          
          stopVoiceListening();
          runDualEnginePipeline(true);
        };

        recognition.onerror = (event) => {
          console.warn("Speech recognition notice/error:", event.error);
          stopVoiceListening();
        };

        recognition.onend = () => {
          stopVoiceListening();
        };
      }
    }
    initSpeechRecognition();

    function toggleVoiceChat() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
      }
      if (isListening) {
        stopVoiceListening();
      } else {
        startVoiceListening();
      }
    }

    function startVoiceListening() {
      try {
        recognition.lang = currentLanguage;
        recognition.start();
      } catch (e) {
        console.log("Mic restart trace:", e);
        stopVoiceListening();
      }
    }

    function stopVoiceListening() {
      isListening = false;
      const voiceBtn = document.getElementById('voiceBtn');
      voiceBtn.classList.remove('recording');
      voiceBtn.innerText = '🎤 Live Voice';
      document.getElementById('statusLabel').innerText = "System Active";
    }

    function speakOutput(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        // Slight delay ensures microphone device fully detaches before speaker engages
        setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.0;
          utterance.pitch = isChildMode ? 1.3 : 1.0;
          utterance.lang = currentLanguage;
          window.speechSynthesis.speak(utterance);
        }, 150);
      }
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settingsModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function updateSelectedLanguage() {
      currentLanguage = document.getElementById('langSelect').value;
      if (recognition) recognition.lang = currentLanguage;
    }

    function toggleChildMode(enable) {
      isChildMode = enable;
      const body = document.body;
      const displayTitle = document.getElementById('displayUsername');

      if (enable) {
        body.classList.add('child-mode');
        displayTitle.innerText = "KITTY AI — [CHILDISH MALAYALAM STORY MODE]";
        currentLanguage = 'ml-IN';
        document.getElementById('langSelect').value = 'ml-IN';
        appendMessage('KITTY AI', 'ഹലോ! ഞാൻ കിറ്റി. നമുക്ക് നല്ല കഥകൾ പറയാം! (Press Ctrl+Y to Exit)', false);
      } else {
        body.classList.remove('child-mode');
        if (activeCredentials) {
          displayTitle.innerText = `LOOPER AI — [${activeCredentials.username.toUpperCase()}]`;
        }
        currentLanguage = 'en-US';
        document.getElementById('langSelect').value = 'en-US';
        appendMessage('LOOPER AI', 'Switched back to Dual Loop AI workspace.', false);
      }
      initSpeechRecognition();
    }

    function openAdminWindow() {
      document.getElementById('adminWindow').style.display = 'flex';
      document.getElementById('adminCodeEditor').value = document.documentElement.outerHTML;
      document.getElementById('adminBehaviorEditor').value = adminCustomBehavior;
    }

    function closeAdminWindow() {
      document.getElementById('adminWindow').style.display = 'none';
    }

    function applyAdminUpdates() {
      adminCustomBehavior = document.getElementById('adminBehaviorEditor').value;
      const updatedHTML = document.getElementById('adminCodeEditor').value;
      
      document.open();
      document.write(updatedHTML);
      document.close();
    }

    window.addEventListener('load', () => {
      const activeSession = localStorage.getItem('looper_active_session');
      if (activeSession) {
        try {
          const sessionData = JSON.parse(activeSession);
          activeCredentials = sessionData.credentials;
          activePassword = sessionData.password;
          allSessions = sessionData.allSessions || [];
          
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('displayUsername').innerText = `LOOPER AI — [${activeCredentials.username.toUpperCase()}]`;
          
          if (allSessions.length > 0) {
            loadChatSession(allSessions[0].id);
          } else {
            startNewChat();
          }
          renderHistorySidebar();
        } catch(e) {
          console.log("No valid active session found.");
        }
      }
    });

    function handleLaunch() {
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const gk = document.getElementById('loginGptKey').value.trim();
      const gmk = document.getElementById('loginGeminiKey').value.trim();

      if (!u || !p || !gmk) {
        alert("Username, Password, and Gemini Key are required.");
        return;
      }

      activePassword = p;
      activeCredentials = { username: u, gptKey: gk, geminiKey: gmk };
      
      saveActiveSession();
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('displayUsername').innerText = `LOOPER AI — [${u.toUpperCase()}]`;
      
      startNewChat();
    }

    function saveActiveSession() {
      const sessionData = {
        credentials: activeCredentials,
        password: activePassword,
        allSessions: allSessions
      };
      localStorage.setItem('looper_active_session', JSON.stringify(sessionData));
    }

    function logoutSession() {
      localStorage.removeItem('looper_active_session');
      location.reload();
    }

    function startNewChat() {
      currentSessionId = 'session_' + Date.now();
      const newSession = {
        id: currentSessionId,
        title: 'New Conversation',
        messages: []
      };
      allSessions.unshift(newSession);
      saveActiveSession();
      renderHistorySidebar();
      renderChatMessages([]);
    }

    function loadChatSession(id) {
      currentSessionId = id;
      const session = allSessions.find(s => s.id === id);
      if (session) {
        renderChatMessages(session.messages);
        renderHistorySidebar();
      }
    }

    function renderHistorySidebar() {
      const listContainer = document.getElementById('historyList');
      listContainer.innerHTML = '';

      allSessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        item.innerText = session.title;
        item.onclick = () => loadChatSession(session.id);
        listContainer.appendChild(item);
      });
    }

    function renderChatMessages(messages) {
      const chatDisplay = document.getElementById('chatDisplay');
      chatDisplay.innerHTML = '';
      messages.forEach(msg => {
        appendMessage(msg.author, msg.text, msg.isUser, msg.isNotice);
      });
    }

    function appendMessage(author, text, isUser = false, isNotice = false) {
      const chatDisplay = document.getElementById('chatDisplay');
      const row = document.createElement('div');
      
      row.className = isNotice ? 'msg-row sys-notice' : `msg-row ${isUser ? 'user' : 'looper'}`;

      const authorLbl = document.createElement('div');
      authorLbl.className = 'msg-author';
      authorLbl.innerText = author.toUpperCase();

      const contentBox = document.createElement('div');
      contentBox.className = 'msg-content';
      contentBox.innerText = text;

      row.appendChild(authorLbl);
      row.appendChild(contentBox);
      chatDisplay.appendChild(row);
      chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function queryGeminiDirectly(promptText) {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeCredentials.geminiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });

      const data = await response.json();
      if (!response.ok || !data.candidates?.[0]) {
        throw new Error(data.error?.message || "Gemini API failed.");
      }

      return data.candidates[0].content.parts[0].text;
    }

    async function runDualEnginePipeline(speakResponse = false) {
      const promptInput = document.getElementById('promptInput');
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      promptInput.value = '';
      appendMessage('USER', prompt, true);

      let session = allSessions.find(s => s.id === currentSessionId);
      if (!session) {
        startNewChat();
        session = allSessions[0];
      }

      if (session.messages.length === 0) {
        session.title = prompt.length > 25 ? prompt.substring(0, 25) + '...' : prompt;
        renderHistorySidebar();
      }

      session.messages.push({ author: 'USER', text: prompt, isUser: true });
      saveActiveSession();

      const statusLbl = document.getElementById('statusLabel');
      let gptResponseText = null;

      if (activeCredentials && activeCredentials.gptKey && !isGptDisabled) {
        statusLbl.innerText = "Processing with OpenAI...";
        try {
          const gptRes = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${activeCredentials.gptKey}`
            },
            body: JSON.stringify({
              model: "gpt-4o",
              messages: [
                { role: "system", content: adminCustomBehavior || (isChildMode ? "You are Kitty AI, speaking simple friendly stories to children in Malayalam." : "Provide a comprehensive draft answer to the user query.") },
                { role: "user", content: prompt }
              ]
            })
          });

          const gptData = await gptRes.json();

          if (!gptRes.ok || !gptData.choices?.[0]) {
            throw new Error(gptData.error?.message || "OpenAI API failed.");
          }

          gptResponseText = gptData.choices[0].message.content;

        } catch (gptErr) {
          isGptDisabled = true;

          if (!hasShownGptFallbackNotice) {
            hasShownGptFallbackNotice = true;
            const noticeMsg = `⚠️ OpenAI Error: ${gptErr.message}\nSwitching to Gemini only...`;
            appendMessage('SYSTEM NOTICE', noticeMsg, false, true);
            session.messages.push({ author: 'SYSTEM NOTICE', text: noticeMsg, isNotice: true });
            saveActiveSession();
          }
        }
      }

      try {
        statusLbl.innerText = "Analyzing & Synthesizing...";
        let finalOutput = "";

        if (gptResponseText) {
          const synthesisPrompt = `You are the master synthesis node of Looper AI. ${adminCustomBehavior} ${isChildMode ? "You are Kitty AI speaking Malayalam." : ""} Analyze both the original request and the preliminary solution, then combine the best elements into a single, highly accurate, unified response.\n\n--- USER PROMPT ---\n${prompt}\n\n--- OPENAI DRAFT ---\n${gptResponseText}\n\nDeliver the final unified response directly.`;
          finalOutput = await queryGeminiDirectly(synthesisPrompt);
        } else {
          const systemContext = isChildMode ? `[Instruction: Respond as Kitty AI telling a simple story in Malayalam] ${prompt}` : prompt;
          finalOutput = await queryGeminiDirectly(systemContext);
        }

        const engineLabel = isChildMode ? 'KITTY AI (MALAYALAM)' : (gptResponseText ? 'LOOPER AI (MIXED DUAL-ENGINE)' : 'LOOPER AI (GEMINI)');
        appendMessage(engineLabel, finalOutput, false);
        session.messages.push({ author: engineLabel, text: finalOutput, isUser: false });
        saveActiveSession();

        statusLbl.innerText = "System Active";

        if (speakResponse || isChildMode) {
          speakOutput(finalOutput);
        }

      } catch (geminiErr) {
        statusLbl.innerText = "Execution Error";
        const errMsg = `Gemini Error: ${geminiErr.message}`;
        appendMessage('LOOPER AI ERROR', errMsg, false);
        session.messages.push({ author: 'LOOPER AI ERROR', text: errMsg, isUser: false });
        saveActiveSession();
      }
    }

    function exportBackupJson() {
      const backupData = {
        version: "2.0",
        timestamp: new Date().toISOString(),
        credentials: activeCredentials,
        password: activePassword,
        allSessions: allSessions
      };

      const jsonStr = JSON.stringify(backupData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `looper_ai_full_backup_${Date.now()}.json`;
      a.click();
    }

    function triggerImportJson() {
      document.getElementById('importFileInput').click();
    }

    function handleImportJson(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);

          if (importedData.credentials || importedData.allSessions) {
            if (importedData.credentials) activeCredentials = importedData.credentials;
            if (importedData.password) activePassword = importedData.password;
            if (importedData.allSessions) allSessions = importedData.allSessions;
          } else if (Array.isArray(importedData)) {
            allSessions = importedData;
          }

          saveActiveSession();

          document.getElementById('authOverlay').style.display = 'none';
          if (activeCredentials && activeCredentials.username) {
            document.getElementById('displayUsername').innerText = `LOOPER AI — [${activeCredentials.username.toUpperCase()}]`;
          }

          if (allSessions.length > 0) {
            loadChatSession(allSessions[0].id);
          } else {
            startNewChat();
          }

          renderHistorySidebar();
          alert("✅ Looper AI backup successfully restored!");

        } catch (err) {
          alert("❌ Failed to import backup: Invalid JSON file format.");
        }
      };

      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
</body>
